# ============================================
# PYTEST CONFIGURATION
# ============================================
#
# HOW TO RUN TESTS:
#
#   From the project root directory, run:
#       pytest
#
#   That's it. pytest will automatically find and run all test files
#   in the tests/ folder.
#
# USEFUL OPTIONS:
#
#   pytest -v              Show each test name and result (verbose)
#   pytest -x              Stop on first failure
#   pytest -v -x           Both: verbose + stop on first failure
#   pytest tests/test_response_parsing.py   Run just one test file
#   pytest -k "confidence" Run only tests with "confidence" in the name
#
# WHAT THE OUTPUT MEANS:
#
#   .  = test passed
#   F  = test failed (shows what went wrong)
#   E  = test errored (code crashed, different from wrong answer)
#   s  = test skipped
#
#   Example output:
#     tests/test_response_parsing.py ............   [100%]
#     15 passed in 0.02s
#
#   If a test fails, pytest shows:
#     - Which test failed
#     - What value was expected
#     - What value was actually produced
#     - The exact line of code that failed
#

[pytest]
# Where to look for tests
testpaths = tests

# Only run files that start with "test_"
python_files = test_*.py

# Only run functions that start with "test_"
python_functions = test_*

# Show a short summary of failures at the end
addopts = --tb=short -q
